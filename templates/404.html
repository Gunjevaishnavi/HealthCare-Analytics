{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="fs-1 text-primary mb-3"><i class="bi bi-compass"></i></div>
        <h3 class="fw-bold text-dark">404 - Resource Not Found</h3>
        <p class="text-muted">The requested page or endpoint does not exist in the Healthcare Analytics portal.</p>
        <a href="{{ url_for('dashboard_view') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
